name: CI

on:
  push:
    branches: [main, next/lens-1]
  pull_request:
    branches: [main, next/lens-1]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      matrix:
        node-version: [22, 24]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Fresh resolution — no committed lockfile (library policy). `cache: npm` is dropped
      # because it keys off the (now absent) lockfile.
      # npm 10's Arborist crashes resolving the current unlocked peer graph
      # (edgesOut of null). Pin the installer, without weakening peer checks.
      - run: npx --yes npm@11.21.0 install
      - run: npm run build
      - run: npm test

      # The unpublished major preparation now uses Foottrace in production;
      # Both lanes install and exercise the exact packed /record contract.
      - name: Verify isolated record package
        run: npm run test:record-pilot

      - name: Install browser for lazy graph verification
        if: matrix.node-version == 24
        run: npx playwright install --with-deps chromium
      - name: Verify packed lazy graph loading in a browser
        if: matrix.node-version == 24
        timeout-minutes: 10
        env:
          LENS_BROWSER_EVIDENCE_ROOT: ${{ runner.temp }}/lens-browser-evidence
        run: npm run test:lazy-browser
      - name: Preserve browser verification evidence
        if: always() && matrix.node-version == 24
        uses: actions/upload-artifact@v4
        with:
          name: lens-packed-browser-proof
          path: |
            ${{ runner.temp }}/lens-browser-evidence/*/verification.json
            ${{ runner.temp }}/lens-browser-evidence/*/failure.json
            ${{ runner.temp }}/lens-browser-evidence/*/metafile.json
            ${{ runner.temp }}/lens-browser-evidence/*/installed-tree.json
            ${{ runner.temp }}/lens-browser-evidence/*/*.png
            ${{ runner.temp }}/lens-browser-evidence/*/footprint-explainable-ui-1.0.0.tgz

      # Packaging-correctness gate on the would-be-published tarball (now that the dual
      # CJS/ESM types + exports are correct). attw exits non-zero on a types masquerade /
      # broken subpath; publint on a packaging error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
