name: CI

on:
  push:
    branches: [main, next/lens-1]
  pull_request:
    branches: [main, next/lens-1]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Fresh resolution — no committed lockfile (library policy). `cache: npm` is dropped
      # because it keys off the (now absent) lockfile.
      # npm 10's Arborist crashes resolving the current unlocked peer graph
      # (edgesOut of null). Pin the installer, without weakening peer checks.
      - run: npx --yes npm@11.21.0 install

      # Collection success means complete evidence, not a clean audit. Known
      # upstream findings keep their original nonzero audit status in the report.
      - name: Collect full and production audit evidence
        run: npx --yes npm@11.21.0 run audit:evidence

      - name: Test audit evidence failure handling
        run: npm run test:dependency-audit

      - run: npm run build
      - run: npm test

      - name: Build seven-workflow preview
        if: matrix.node-version == 22
        run: npx vite build --config examples/local-playground/vite.config.ts

      - name: Build deployment shapes example
        if: matrix.node-version == 22
        run: |
          npx tsc -p examples/deployment-shapes/tsconfig.json
          npx vite build --config examples/deployment-shapes/vite.config.ts

      - name: Check and build shared controller example
        if: matrix.node-version == 22
        run: |
          npx tsc -p examples/headless-controller/tsconfig.json
          npx vite build --config examples/headless-controller/vite.config.ts

      - name: Verify the Go recording against the public Foottrace reader
        if: matrix.node-version == 22
        run: node examples/record-slider/go/verify.mjs

      - name: Check and build Foottrace record slider example
        if: matrix.node-version == 22
        run: |
          npx tsc -p examples/record-slider/tsconfig.json
          npx vite build --config examples/record-slider/vite.config.ts

      - name: Save the PR's record slider preview
        if: matrix.node-version == 22 && github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: record-slider-preview
          path: demo-dist/record-slider/
          if-no-files-found: error
          retention-days: 7

      - name: Save built package for independent verification
        if: matrix.node-version == 22
        run: npm pack --ignore-scripts --json --pack-destination dependency-security > dependency-security/packed-review.json

      # The optional recording reader uses Foottrace 2's Node 22 runtime.
      - name: Test the Foottrace reader and its isolated packed consumer
        if: matrix.node-version == 22
        env:
          UI_PACKED_REVIEW: dependency-security/packed-review.json
        run: npm run test:record-pilot

      - name: Verify packed scoped trace consumers
        if: matrix.node-version == 22
        run: node scripts/check-scoped-trace-package.mjs

      - name: Verify packed investigation consumers without a cause reader
        if: matrix.node-version == 22
        run: node scripts/check-investigation-package.mjs

      - name: Verify packed isometric consumers
        if: matrix.node-version == 22
        run: node scripts/check-isometric-package.mjs

      - name: Verify packed progressive rendering consumers
        if: matrix.node-version == 22
        run: node scripts/check-progressive-package.mjs

      - name: Verify packed headless controller consumers
        if: matrix.node-version == 22
        run: node scripts/check-headless-package.mjs

      - name: Verify packed display preflight consumers
        if: matrix.node-version == 22
        run: node scripts/check-display-admission-package.mjs

      - name: Verify packed directional coverage consumers
        if: matrix.node-version == 22
        run: node scripts/check-directional-coverage-package.mjs

      - name: Verify packed investigation wording and host labels
        if: matrix.node-version == 22
        run: node scripts/check-investigation-wording-package.mjs

      # Packaging-correctness gate on the would-be-published tarball (now that the dual
      # CJS/ESM types + exports are correct). attw exits non-zero on a types masquerade /
      # broken subpath; publint on a packaging error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      - name: Retain actual dependency graph and security reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: dependency-security-node-${{ matrix.node-version }}
          path: dependency-security/
          if-no-files-found: error
          retention-days: 7
