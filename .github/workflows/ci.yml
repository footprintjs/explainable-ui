name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # Fresh resolution — no committed lockfile (library policy). `cache: npm` is dropped
      # because it keys off the (now absent) lockfile.
      - run: npm install
      - run: npm run build
      - run: npm test

      # Packaging-correctness gate on the would-be-published tarball (now that the dual
      # CJS/ESM types + exports are correct). attw exits non-zero on a types masquerade /
      # broken subpath; publint on a packaging error.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack
