name: Deploy demo to GitHub Pages

# Builds the gallery at /explainable-ui/ and the seven-workflow preview at
# /explainable-ui/local-playground/, plus the deployment-shapes consumer example.
on:
  push:
    branches: [main]
    paths:
      - 'demo/**'
      - 'examples/local-playground/**'
      - 'examples/node-icons/**'
      - 'examples/deployment-shapes/**'
      - 'src/**'
      - 'vite.config.ts'
      - 'package.json'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      # Keep the demo's unlocked resolution on the same installer as CI.
      - run: npx --yes npm@11.21.0 install
      - run: npm run demo:build
      # Build second: the gallery clears demo-dist; this clears only its child.
      - name: Build seven-workflow preview
        run: npx vite build --config examples/local-playground/vite.config.ts
      - name: Build deployment shapes example
        run: npx vite build --config examples/deployment-shapes/vite.config.ts
      - uses: actions/upload-pages-artifact@v3
        with:
          path: demo-dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
