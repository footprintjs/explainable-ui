name: Publish to npm

on:
  release:
    types: [published]

# Least privilege: NO id-token at the top level. OIDC publish power is granted ONLY to
# the `publish` job below, which consumes the build job's pre-built artifact and does ZERO
# dependency resolution — so the unpinned `npm install` (in `build`) never shares a runtime
# with the registry token or `npm publish --provenance`.
permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.16.0'

      # Fresh resolution (no committed lockfile — a library's lock is stripped on publish
      # and can only pin the build env to a stale internal dep). This job has NO publish
      # power, so an unpinned dep here cannot reach the registry token.
      # npm 10's Arborist crashes resolving the current unlocked peer graph
      # (edgesOut of null) — v0.38.1 was tagged but never published because of it.
      # Same pinned installer and same order as ci.yml (build, then test).
      - run: npx --yes npm@11.21.0 install
      - run: npm run build
      - run: npm test

      # Packaging-correctness gate — block a publish that would ship a types masquerade /
      # broken subpath export.
      - run: npx publint
      - run: npx @arethetypeswrong/cli --pack

      # Stage the files listed in package.json and the package metadata.
      - name: Stage published package
        run: node scripts/stage-package.mjs pkg

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: package
          path: pkg/
          retention-days: 1

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      id-token: write # OIDC trusted publishing — granted to THIS job only
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: package

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6.5.0
        with:
          node-version: '22.16.0'
          registry-url: https://registry.npmjs.org

      # Pinned to the 11.x line: npm 12.0.0 went `latest` on 2026-07-08 with a broken
      # provenance path (MODULE_NOT_FOUND: sigstore) that fails `npm publish --provenance`.
      - run: npm install -g npm@11

      # Publishes the pre-built artifact. No node_modules, no dependency resolution.
      # Trusted publishing: no NODE_AUTH_TOKEN — npm authenticates via the GitHub OIDC token.
      - name: Publish to npm
        run: npm publish --provenance --access public
